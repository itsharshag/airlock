<!doctype html><html><head><meta charset="utf-8"><title>Tip Jar</title>
<style>body{font:16px/1.5 -apple-system,Segoe UI,Inter,sans-serif;background:#f6f3ee;color:#1d1b18;margin:0;display:grid;place-items:center;min-height:100vh}
.c{background:#fff;border-radius:16px;padding:36px;width:420px;box-shadow:0 10px 40px #0001}h1{margin:0 0 6px}p{color:#6b655c;margin:0 0 20px}
button{display:block;width:100%;height:46px;margin:10px 0;border:0;border-radius:10px;font:600 15px inherit;font-family:inherit;cursor:pointer;background:#1d1b18;color:#fff}
button.alt{background:#ece6dc;color:#1d1b18}#out{margin-top:14px;font-size:13px;color:#6b655c;word-break:break-all;min-height:20px}</style></head>
<body><div class="c"><h1>Tip Jar</h1><p>Leave a note on the NEAR guestbook, or tip the creator.</p>
<button id="sign">Sign the guestbook</button><button id="tip" class="alt">Tip 0.1 NEAR</button><div id="out"></div></div>
<script src="/app.js"></script></body></html>
